name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.5"}
      - run: uv sync --frozen
      - run: uv run pytest -q
      # Regression gate: eval_metrics.json (from `eval.py report --final`, run locally on the private
      # labeled set) must not regress vs eval_baseline.json beyond tolerance.
      - run: uv run python eval.py gate
